# Professor-guided comparative PGSA -> HUBO experiment.
# One synthetic population and one read set are shared across ALL graph builders.

qpg:
  repo_url: "https://github.com/jkbonfield/qpg.git"
  commit: "f0c624f0c326c12626258dab6707d1671bb098b8"

  # Current "Medium" synthetic-population parameters from qpg/config_base.sh.
  # Population size = 100; generations = 10; nominal sequence length = 10 kb.
  genome_opts: "-S 0.005 -C 0.001 -N 0.01 -n 0.01 -A 0.0005 -L 0.0001 -T 0.0001 -I 0.0002 -l 10000 -P 100 -G 10"
  population_seed: 104

population:
  # The same 40 training genomes feed all three builders.
  n_training: 40
  n_test: 10
  split_seed: 104
  # Which member of the fixed 10-genome test set is used for the first run.
  heldout_index: 0

builders:
  names:
    - minigraph
    - minigraph_cactus
    - pggb

  minigraph:
    threads: 8
    # Mirrors qpg/run_sim_create_gfa.sh.
    args: "-l 1000 -d 10000 -n 5,20 -cxggs"

  minigraph_cactus:
    threads: 8
    # Appropriate for deliberately small synthetic chromosomes.
    args: "--noSplit --permissiveContigFilter"

  pggb:
    threads: 8
    map_pct_id: 90
    segment_length: 1000

reads:
  # Generated ONCE from the held-out genome and reused for all builders.
  coverage: 30
  read_length: 200
  substitution_error_rate: 0.001
  seed: 2026

mapping:
  # GraphAligner is used identically on every normalized GFA.
  threads: 8
  min_mapq: 10
  graphaligner_args: "--min-alignment-score 90 --seeds-minimizer-ignore-frequent 1e-2 -x vg"

copy_number:
  # Builder-independent baseline for the three-way graph comparison.
  # Use the median depth across all mapped nodes above min_depth. This avoids
  # PGGB's near-all-cycle topology collapsing the historical qpg baseline.
  mode: "robust_median"
  min_depth: 0.1
  depth_div: 4.0
  fit_step: 0.1

  # Preserve the historical qpg copy-number offset/clamps after baseline fitting.
  offset: 0.4
  min_copy: 0.45
  max_copy: 10.0

subgraph:
  # The original PGSA optimization is a tangle-resolution subproblem.
  # Use the SAME selector for all builders. Set mode=whole only for graphs
  # small enough to expand symbolically.
  mode: "auto"
  radius: 2
  min_nodes: 3
  max_nodes: 10
  repeat_copy_threshold: 1.5

hubo:
  # Eq. (9) edge-following penalty.
  lambda_edge: 10.0

  # Explicit penalty for unused binary state IDs X_t >= 2N.
  # This makes validity treatment identical across all graph builders.
  lambda_invalid: 100.0

  # Initial T is sum_v w(v), converted to an integer by the policy below.
  walk_length: "sum_weights"
  fractional_T_policy: "nearest"  # nearest | floor | ceil | error

  # Deliberate safety guard; increase only after inspecting N, T, and q.
  max_variables: 96
  max_terms: 2000000
  coefficient_tolerance: 1.0e-12

validation:
  random_tests: 250
  seed: 7
  exhaustive_limit: 18
  tolerance: 1.0e-8
